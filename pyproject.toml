[project]
name = "horrible-dashboard"
version = "0.1.0"
description = "Unified one-stop app for everything — emacs for the agentic era"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "ptyprocess>=0.7.0 ; sys_platform != 'win32'",
    "pydantic>=2.13.4",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "uvicorn[standard]>=0.49.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
