[project]
name = "horrible-dashboard"
version = "0.2.0"
description = "Unified one-stop app for everything — emacs for the agentic era"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "duckdb>=1.5.4",
    "fastapi>=0.136.3",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30",
    "jupyter-client>=8.6",
    "kaggle>=1.6",
    "lancedb>=0.34.0",
    "litellm>=1.92.0",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=3.0.3",
    "pillow>=10",
    "psycopg[binary]>=3.3.4",
    "ptyprocess>=0.7.0 ; sys_platform != 'win32'",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "pypdf>=6.14.2",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "scikit-learn>=1.9.0",
    "trafilatura>=2.1.0",
    "tokenizers>=0.21",
    "tree-sitter-language-pack>=1.12.2",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
    "zeroconf>=0.150.0",
    "mcp>=1.28.1",
    "dnspython>=2.8.0",
    "pymongo>=4.17.0",
    "gymnasium>=1.3.0",
    # The karaoke module's search + download. A core dep rather than an extra
    # because it is the whole point of that module and it's a pure-Python wheel
    # (no native build, no browser binary) — the cost of shipping it is a few MB.
    # It is still lazy-imported: `import yt_dlp` is ~1s of module scanning, and
    # most sessions never open the karaoke pane.
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
# WebRTC datachannel transport (NAT traversal). Heavy native deps (PyAV/cffi), so it's
# opt-in: `uv sync --extra webrtc`. The transport is lazy-imported and skipped without it.
webrtc = ["aiortc>=1.9"]
# Native ViZDoom engine for the vizdoom_toy / vizdoom_duel games (server-rendered Doom
# frames + real multiplayer netcode). Prebuilt wheels exist for Windows amd64, Linux
# x86_64/aarch64, and Apple-Silicon macOS 14+; Intel/old macOS build from sdist (needs
# `brew install cmake boost sdl2 openal-soft`). It's lazy-imported, so the core app
# installs everywhere without it — only nodes that actually run a Doom table need it:
# `uv sync --extra games-native`. The Fly game-server image pulls it in its Dockerfile.
games-native = ["vizdoom>=1.3"]
# Real headless-Chromium engine for the embedded browser's "full mode" (server-rendered
# frames + live DOM the agent can read/scrape/drive). Playwright ships prebuilt browser
# binaries per-OS via a one-time `playwright install chromium` (~150 MB), so it's opt-in:
# `uv sync --extra browser-engine`. It's lazy-imported and gated behind
# HORRIBLE_ENABLE_SERVER_BROWSER=1 — without it the panel stays in the light iframe mode.
browser-engine = ["playwright>=1.4"]
# CLIP image embeddings for the library's visual search (find media by what it *looks*
# like, not just its alt text). ONNX Runtime rather than torch on purpose: the runtime is
# ~60 MB against torch's ~1-2 GB, and `pillow` / `numpy` / `huggingface-hub` are already
# core deps, so this stays installable on every OS. Weights (~350 MB, ViT-B/32) download
# once on first use. Lazy-imported and gated by the `library.clipEnabled` setting —
# without the extra, media stays text-proxy-only: `uv sync --extra clip`.
clip = ["onnxruntime>=1.18", "tokenizers>=0.20"]
# Oracle Database (including 23ai AI Vector Search) for the database module. Thin mode
# is pure Python — no Oracle Instant Client — so this is a small, portable wheel; it's
# still an extra because most nodes never point at an Oracle instance:
# `uv sync --extra oracle`.
oracle = ["oracledb>=2.5"]
# Voice for the Clubhouse agent: local Whisper speech-to-text plus Edge text-to-speech.
# Whisper needs torch (~1-2 GB), which is exactly why this is an extra and not a core
# dep — every other module works without a word of audio. Both services are
# lazy-imported and `/api/agent/stt|tts` answer 503 rather than 500 when it's missing:
# `uv sync --extra voice`. Decoding the browser's WebM/Opus chunks also needs `ffmpeg`
# on PATH (the same optional binary karaoke's pitch shift uses).
voice = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "edge-tts>=7.0.0",
]
# Vector stores the database console can query natively (json dialect). Each is
# lazy-imported by its driver, so the console lists the provider either way and only
# fails — with an install hint — when you actually run a query against one.
# LanceDB needs no extra: it's already a core dep (it *is* the node's vector store).
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.9"]
weaviate = ["weaviate-client>=4.6"]
# Everything above in one shot, for a node that inspects several stores.
vectordb = ["chromadb>=0.5", "qdrant-client>=1.9", "weaviate-client>=4.6"]
geoip = [
    "geoip2>=5.3.0",
]
# Activation tracing (`backend/modules/llamacpp/tracer.py`). This is the *trace* path
# and it is a different artifact from the chat path: chat runs a downloaded upstream
# `llama-server` binary, tracing runs whatever libllama this wheel bundles — which is
# precisely why a trace may only be overlaid on a chat turn when both the build and the
# model match. Pinned with `==` and not `>=` on purpose: `ggml_abi.py` mirrors the first
# fields of `struct ggml_tensor`, which is internal C with no stability promise, so the
# version that was checked is the version that is allowed. Opt-in
# (`uv sync --extra llamacpp`), lazy-imported, and CPU-only; PyPI ships an sdist rather
# than wheels, so installing it builds llama.cpp and needs cmake plus a C++ compiler.
llamacpp = ["llama-cpp-python==0.3.34"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# A hung test (stuck subprocess/kernel/socket) must fail with a stack dump rather
# than block the whole session forever. `thread` method is the Windows-compatible
# one (signal/SIGALRM is POSIX-only). Generous default fits the real-kernel tests
# (which legitimately wait up to ~90s); override per-test with @pytest.mark.timeout.
timeout = 180
timeout_method = "thread"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "httpx>=0.28.1",
    "ipykernel>=6",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]
