[project]
name = "horrible-dashboard"
version = "0.1.0"
description = "Unified one-stop app for everything — emacs for the agentic era"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "duckdb>=1.5.4",
    "fastapi>=0.136.3",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30",
    "jupyter-client>=8.6",
    "kaggle>=1.6",
    "nbformat>=5.10",
    "psycopg[binary]>=3.3.4",
    "ptyprocess>=0.7.0 ; sys_platform != 'win32'",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "trafilatura>=2.1.0",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
    "zeroconf>=0.150.0",
]

[project.optional-dependencies]
# WebRTC datachannel transport (NAT traversal). Heavy native deps (PyAV/cffi), so it's
# opt-in: `uv sync --extra webrtc`. The transport is lazy-imported and skipped without it.
webrtc = ["aiortc>=1.9"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "httpx>=0.28.1",
    "ipykernel>=6",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
