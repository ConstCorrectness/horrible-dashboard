[project]
name = "horrible-mod-karaoke"
version = "0.1.0"
description = "Karaoke module for horrible-dashboard (the Python half)."
requires-python = ">=3.11"
# fastapi, pydantic and yt-dlp come from the host (`backend.kernel`).
dependencies = []

[project.entry-points."horrible.modules"]
karaoke = "horrible_mod_karaoke:MODULE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horrible_mod_karaoke"]
