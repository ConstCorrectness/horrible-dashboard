# Fly.io deployment for the public share relay (backend/share_relay).
#
# Lives at the repo ROOT for the same reason fly.toml does: flyctl resolves the build
# context and Dockerfile path relative to the config file's directory, and the image
# needs repo-root files (pyproject.toml, uv.lock, backend/). Deploy from the root:
#   fly deploy -c fly.share.toml
# One-time setup and the operational notes are in docs/architecture/share-relay.mdx.
#
# KEEP THIS AT ONE MACHINE until token-based session affinity is implemented.
#
# The registry and the live tracks are in one machine's memory, and Fly load-balances
# across machines -- so with more than one, a mint lands on machine A, the viewer's
# WHEP lands on machine B, and B has never heard of that token. Observed exactly that
# with 4 machines: the node reported the stream live while /health said `streams: 0`.
#
# Scaling out needs real affinity: the app must return a `fly-replay: instance=<id>`
# RESPONSE header to bounce a request to the machine that owns the token (which means
# the token has to carry that machine id). Note `fly-replay-src` is the header Fly
# ADDS TO a replayed request -- inbound, informational, and no use for steering.

app = 'horrible-share'
primary_region = 'iad'

[build]
  dockerfile = 'deploy/share-relay/Dockerfile'

[env]
  # Hand the TURN credential to the VIEWER page, not just to the relay's own peer
  # connections. Without this a viewer gets STUN only, and anyone behind a
  # symmetric or carrier-grade NAT cannot form a path at all -- they sit on a
  # black rectangle while a viewer on a friendlier network watches happily, which
  # is exactly how this was found. The cost is real and deliberate: this page is
  # public, so the credential is public, and the operator's TURN bandwidth is
  # usable by anyone holding a link. Rotate SHARE_RELAY_TURN_USER/PASS if that
  # ever stops being an acceptable trade.
  SHARE_RELAY_TURN_FOR_VIEWERS = '1'
  # The origin viewers reach this relay on. Baked in rather than a secret: it appears
  # verbatim in every link the relay mints, so it is public by construction.
  SHARE_RELAY_PUBLIC_URL = 'https://horrible-share.fly.dev'

# SHARE_RELAY_KEY is NOT here. It gates minting, so it is a real secret:
#   fly secrets set SHARE_RELAY_KEY=... -a horrible-share
# Without it any stranger who can reach the relay can mint streams on it and use the
# service as free video hosting. The app logs a warning at boot when it is unset.

[http_service]
  internal_port = 9100
  force_https = true
  # Scale to zero is safe here and genuinely wanted: a relay with no live stream is
  # doing nothing, and a cold start costs the host a second on the first mint. The
  # media path itself never cold-starts -- WHIP only happens after a successful mint.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  # One machine, for the reason at the top of this file. Fly will not add a second
  # on its own with this set, and `fly scale count 1` cleans up any that exist.
  max_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# NOTE ON MEDIA (read before assuming video works).
#
# There is deliberately no `[[services]] protocol = 'udp'` block here. An earlier
# version declared UDP on 9100, which was wrong twice over: 9100 is the HTTP port,
# and aiortc allocates **ephemeral** high UDP ports for RTP, so no fixed port
# declaration corresponds to where the media actually lands.
#
# What makes media work is ICE, not a port mapping. The relay must gather a
# server-reflexive candidate, which needs `SHARE_RELAY_STUN` (defaulted, so this
# works out of the box) -- without it the relay offers only host candidates,
# which on Fly are private addresses. Signaling then succeeds perfectly and no
# video ever arrives, which is the failure this comment exists to prevent.
#
# If STUN is not enough (either end behind a symmetric NAT), the answer is TURN:
#   fly secrets set \
#     SHARE_RELAY_TURN_URL=turn:host:3478 \
#     SHARE_RELAY_TURN_USER=user \
#     SHARE_RELAY_TURN_PASS=pass -a horrible-share
# Set SHARE_RELAY_TURN_FOR_VIEWERS=1 only if viewers need it too -- that hands a
# TURN credential to every stranger who opens a link, along with your bandwidth.

[[vm]]
  # A PERFORMANCE VM, not a shared one, and that is the whole point of this block.
  #
  # aiortc's `MediaRelay` is not a passthrough: it decodes the inbound stream once
  # in a `decoder_worker` thread and re-encodes it per viewer, in software, in
  # Python. The host captures the desktop at its native resolution on purpose
  # (`startCapture` sends no width/height -- scaled text is an unreadable share),
  # so every viewer adds a full-resolution software encoder.
  #
  # On `shared-cpu-1x` that was visibly laggy with a single viewer. A shared vCPU
  # is throttled to a fraction of a core under sustained load, which is exactly
  # what a continuous encode is -- so the burst credits that make shared CPUs feel
  # fine for HTTP are useless here. This is not a workload a shared vCPU can do.
  size = 'performance-2x'
  cpus = 2
  # MEMORY was the first ceiling and is still a real one -- measured, not assumed.
  # On 512mb the machine was OOM-killed 16s after the SECOND viewer connected:
  # 403mb RSS, one publisher and two viewers, no restream running. The kill takes
  # the whole registry with it, since streams and rooms live in this process's
  # memory -- the link goes dead for everyone holding it and the host's browser
  # notices nothing, because WebRTC to a departed peer does not raise.
  memory = '4gb'
  memory_mb = 4096

  # Watch BOTH before raising `max_viewers_per_stream`: 25 is not a number this
  # machine can honour at desktop resolution, on either axis. Restreaming adds an
  # ffmpeg process on top of all of it.
