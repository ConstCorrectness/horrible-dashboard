# Permissions for the native-shell window commands (see src/window.rs). Custom
# app commands are ACL-gated here just like `backend_status`; each needs an
# `allow-*` permission listed in capabilities/default.json.

[[permission]]
identifier = "allow-window-is-fullscreen"
description = "Enables the window_is_fullscreen custom command"
[permission.commands]
allow = ["window_is_fullscreen"]

[[permission]]
identifier = "allow-window-set-fullscreen"
description = "Enables the window_set_fullscreen custom command"
[permission.commands]
allow = ["window_set_fullscreen"]

[[permission]]
identifier = "allow-window-toggle-fullscreen"
description = "Enables the window_toggle_fullscreen custom command"
[permission.commands]
allow = ["window_toggle_fullscreen"]

[[permission]]
identifier = "allow-window-minimize"
description = "Enables the window_minimize custom command"
[permission.commands]
allow = ["window_minimize"]

[[permission]]
identifier = "allow-window-is-maximized"
description = "Enables the window_is_maximized custom command"
[permission.commands]
allow = ["window_is_maximized"]

[[permission]]
identifier = "allow-window-toggle-maximize"
description = "Enables the window_toggle_maximize custom command"
[permission.commands]
allow = ["window_toggle_maximize"]

[[permission]]
identifier = "allow-window-close"
description = "Enables the window_close custom command"
[permission.commands]
allow = ["window_close"]

[[permission]]
identifier = "allow-window-start-resize-dragging"
description = "Enables the window_start_resize_dragging custom command"
[permission.commands]
allow = ["window_start_resize_dragging"]

[[permission]]
identifier = "allow-window-open-workspace"
description = "Enables the window_open_workspace custom command"
[permission.commands]
allow = ["window_open_workspace"]

[[permission]]
identifier = "allow-browser-open-url"
description = "Enables the browser_open_url custom command"
[permission.commands]
allow = ["browser_open_url"]

# Without this the ACL rejects every `invoke('open_external')`, which is not a
# visible error: `openExternal` catches the rejection and returns false, so the
# external-link bridge cancels the click and nothing happens. That took out OAuth
# consent pages, docs links and the sign-in card's own fallback link at once.
[[permission]]
identifier = "allow-open-external"
description = "Enables the open_external custom command"
[permission.commands]
allow = ["open_external"]

# Shows a directory in the OS file manager (the Storage settings section). The
# command itself refuses anything that is not a directory after canonicalizing,
# so this permission cannot become a way to launch an executable.
[[permission]]
identifier = "allow-open-path"
description = "Enables the open_path custom command"
[permission.commands]
allow = ["open_path"]
