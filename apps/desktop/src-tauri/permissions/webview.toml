# Permissions for the native child-webview overlay (see src/webview.rs) backing
# the `browser.nativeWebview` capability. Custom app commands are ACL-gated here
# just like the window commands; each needs an `allow-*` permission listed in
# capabilities/default.json, and a new file in this directory must also be added
# to PERMISSION_FILES in main.rs (include_str! can't be globbed).

[[permission]]
identifier = "allow-create-browser-webview"
description = "Enables the create_browser_webview custom command"
[permission.commands]
allow = ["create_browser_webview"]

[[permission]]
identifier = "allow-update-browser-webview-bounds"
description = "Enables the update_browser_webview_bounds custom command"
[permission.commands]
allow = ["update_browser_webview_bounds"]

[[permission]]
identifier = "allow-set-browser-webview-visible"
description = "Enables the set_browser_webview_visible custom command"
[permission.commands]
allow = ["set_browser_webview_visible"]

[[permission]]
identifier = "allow-navigate-browser-webview"
description = "Enables the navigate_browser_webview custom command"
[permission.commands]
allow = ["navigate_browser_webview"]

[[permission]]
identifier = "allow-close-browser-webview"
description = "Enables the close_browser_webview custom command"
[permission.commands]
allow = ["close_browser_webview"]

[[permission]]
identifier = "allow-close-all-browser-webviews"
description = "Enables the close_all_browser_webviews custom command"
[permission.commands]
allow = ["close_all_browser_webviews"]

# browser.nativeCdp (src/browser_cdp.rs): the agent driving the native pane, the
# pane observing its own navigation and network, and F12. The method and event
# allowlists are enforced in Rust; these only make the commands callable at all.

[[permission]]
identifier = "allow-cdp-browser-webview"
description = "Enables the cdp_browser_webview custom command"
[permission.commands]
allow = ["cdp_browser_webview"]

[[permission]]
identifier = "allow-subscribe-browser-webview-cdp"
description = "Enables the subscribe_browser_webview_cdp custom command"
[permission.commands]
allow = ["subscribe_browser_webview_cdp"]

[[permission]]
identifier = "allow-open-browser-webview-devtools"
description = "Enables the open_browser_webview_devtools custom command"
[permission.commands]
allow = ["open_browser_webview_devtools"]
