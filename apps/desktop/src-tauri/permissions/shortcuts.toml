# Permissions for the global-shortcut commands (see src/shortcuts.rs). Custom app
# commands are ACL-gated here just like `backend_status`; each needs an `allow-*`
# permission listed in capabilities/default.json.

[[permission]]
identifier = "allow-shortcuts-register"
description = "Enables the shortcuts_register custom command"
[permission.commands]
allow = ["shortcuts_register"]

[[permission]]
identifier = "allow-shortcuts-unregister-all"
description = "Enables the shortcuts_unregister_all custom command"
[permission.commands]
allow = ["shortcuts_unregister_all"]
