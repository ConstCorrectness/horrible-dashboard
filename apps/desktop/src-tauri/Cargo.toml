[package]
name = "horrible-dashboard-desktop"
version = "0.3.0"
description = "Desktop layout shell for horrible-dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: multi-webview (`Window::add_child`), which the embedded browser's
# native overlay is built on — see src/webview.rs. Tauri gates it because the API
# may change between minor releases, so `tauri` is pinned to a patch range here
# rather than floating: an overlay that silently stops compiling is preferable to
# one that silently changes behaviour.
tauri = { version = "~2.11", features = ["unstable"] }
# For `ResizeDirection` (the custom titlebar's edge-resize); the `tauri` crate
# takes this type in `Window::start_resize_dragging` but doesn't re-export it.
tauri-runtime = "2"
# `shortcuts.global`: OS-level accelerators that fire while the app is unfocused.
# The frontend owns which command each one runs (keymap/global.ts).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `open_external`: hand a URL to the user's default browser (OAuth consent pages,
# external links) — the webview itself can't spawn browser windows.
open = "5"
# Remote updates against a signed manifest. The plugin owns the signature check
# (the public key is in tauri.conf.json); src/updater.rs owns which endpoint is
# asked, because the release channel is a runtime setting rather than a build
# constant. Desktop-only — there is nothing to update on a mobile target.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
