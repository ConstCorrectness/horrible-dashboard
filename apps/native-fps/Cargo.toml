[package]
name = "hassault-native"
version = "0.1.0"
edition = "2021"

[dependencies]
minifb = "0.27"
tungstenite = { version = "0.21", features = ["handshake"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
