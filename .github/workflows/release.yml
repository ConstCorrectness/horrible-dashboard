name: Release

# Build the desktop app (apps/desktop, Electron) on all three OSes, sign the update
# artifacts, and publish them to a GitHub Release together with the update feeds
# the app reads. The docs workflow is the precedent for publishing from CI.
#
# Signing: every installer is signed with minisign by `tauri signer sign` — the
# same key and the same two secrets the Tauri shell used, so the update identity
# carries over and installs still on the Tauri shell can verify the move to
# Electron. One-time setup (see docs/architecture/releases.mdx):
#   1. `pnpm dlx @tauri-apps/cli@2.9.6 signer generate -w $HOME/.tauri/horrible.key`
#   2. Put the PUBLIC half in apps/desktop/src/updater-key.ts (UPDATER_PUBKEY).
#   3. Put the PRIVATE half in the repo secret TAURI_SIGNING_PRIVATE_KEY, and its
#      password in TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# The private key never enters the repository. Losing it means no existing install
# can ever be updated again — a new key is a new identity, and every client refuses
# an update it cannot verify. Back it up somewhere that is not this machine.
#
# Channel: the tag decides. `v1.2.3` publishes the `latest*` feeds (stable);
# `v1.2.3-beta.1` publishes `beta*`. Both live on the fixed `updater` release,
# because `updater.ts` picks a channel by filename, not by host.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Pre-create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          IS_PRERELEASE=""
          if [[ "$TAG" == *"-beta"* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "horrible-dashboard $TAG" \
            --notes "Release $TAG" \
            $IS_PRERELEASE

  build:
    needs: create-release
    strategy:
      # Never cancel the others: a macOS build failing must not throw away a
      # finished Windows one, since a partial release is still a release people
      # can update to on the platforms it did produce.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--win --x64'
            manifest: latest.yml
          - platform: ubuntu-22.04
            args: '--linux --x64'
            manifest: latest-linux.yml
          # One job per mac architecture. Each renames its feed so the two do not
          # overwrite each other; publish-manifest merges them. Both run on the
          # arm64 runner, as the Tauri jobs did — which means the x64 build's
          # bundled backend runtime is arm64 too (build-backend-runtime.mjs builds
          # for the host), so on an Intel Mac only a checkout backend works.
          - platform: macos-latest
            args: '--mac --arm64'
            manifest: latest-mac.yml
            rename: latest-mac-arm64.yml
          - platform: macos-latest
            args: '--mac --x64'
            manifest: latest-mac.yml
            rename: latest-mac-x64.yml

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend the app ships, into apps/desktop/backend-runtime, which
      # electron-builder copies as an extraResources entry — so it has to exist
      # before packaging, or every packaged app reports "no backend found". ~1 GB of
      # interpreter and wheels, which is what makes the app work offline on a
      # machine with no Python.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build the bundled backend runtime
        run: node scripts/build-backend-runtime.mjs

      - name: Build the UI
        run: pnpm build

      - name: Package the app
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @horrible/desktop build
          pnpm --filter @horrible/desktop exec electron-builder --publish never ${{ matrix.args }}

      # The signature the app checks before installing anything (updater.ts), and
      # the one installs still on the Tauri shell check too.
      - name: Sign the update artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd apps/desktop/release
          for f in *.exe *.AppImage *.deb *.zip *.dmg; do
            pnpm dlx @tauri-apps/cli@2.9.6 signer sign "$f"
          done

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd apps/desktop/release
          if [ -n "${{ matrix.rename }}" ]; then mv "${{ matrix.manifest }}" "${{ matrix.rename }}"; fi
          gh release upload "$TAG" \
            *.exe *.AppImage *.deb *.zip *.dmg *.sig *.blockmap \
            "${{ matrix.rename || matrix.manifest }}" --clobber

  # The hassault native client. A separate job from `build` on purpose: this crate
  # needs a Rust toolchain and its own set of Linux system libraries — winit/wgpu/cpal
  # want X11, Wayland and ALSA headers — none of which the desktop app needs.
  #
  # These assets are **not** in the signed updater manifest. They are fetched by the
  # backend (`backend/modules/hassault/client_install.py`), verified against the
  # sha256 GitHub publishes for the asset, and installed under `$HORRIBLE_DATA_DIR` —
  # which an update is never allowed to touch.
  build-native:
    needs: create-release
    strategy:
      # Same reasoning as `build`: a macOS failure must not throw away a finished
      # Windows client. A player on the platform that did build gets their client.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            binary: hassault-native.exe
            asset: hassault-native-win-x64.exe
          - platform: ubuntu-22.04
            target: ''
            binary: hassault-native
            asset: hassault-native-linux-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            binary: hassault-native
            asset: hassault-native-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            binary: hassault-native
            asset: hassault-native-macos-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native-fps

      # winit needs X11 + Wayland, cpal needs ALSA: a missing header here fails the
      # link with an error naming a C library, not a Rust crate.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxcursor-dev \
            libxi-dev libxrandr-dev libwayland-dev libasound2-dev

      - name: Build the client
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ matrix.target }}" ]; then ARGS="--target ${{ matrix.target }}"; fi
          cargo build --release --manifest-path apps/native-fps/Cargo.toml $ARGS

      # The asset name is a contract with `client_install.asset_name`, which computes
      # it rather than matching loosely — these are names we control, so a rename here
      # should be a clear miss on the client rather than a wrong download.
      # `backend/tests/test_hassault_client_install.py` reads this file and pins it.
      - name: Upload the client to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            BUILT="apps/native-fps/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            BUILT="apps/native-fps/target/release/${{ matrix.binary }}"
          fi
          cp "$BUILT" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  # Each platform uploaded its own feed onto the version's release. The app reads
  # from the *fixed* `updater` release instead (see MANIFEST_BASE in
  # apps/desktop/src/updater.ts), so the feeds are rewritten for it — absolute URLs,
  # the channel's names, the two mac feeds merged, plus the Tauri-format manifest
  # for installs still on the Tauri shell — and copied there once every platform has
  # uploaded: a feed published before the last platform finishes would offer an
  # update that 404s on the platform still building.
  # `needs` both builds: a feed is what makes a release reachable, and a release
  # reachable before its client assets exist is one where every install button
  # answers "publishes no client for your platform".
  publish-manifest:
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish the feeds to the fixed updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p feeds/in feeds/out
          gh release download "$TAG" --dir feeds/in --clobber \
            --pattern 'latest*.yml' --pattern '*.exe.sig' --pattern '*.AppImage.sig'
          node scripts/publish-update-manifests.mjs --tag "$TAG" --dir feeds/in --out feeds/out

          # Idempotent: the fixed release exists after the first run.
          gh release view updater >/dev/null 2>&1 || gh release create updater \
            --title "Update manifests" \
            --notes "Update feeds read by the desktop app. Not a build — see .github/workflows/release.yml." \
            --target "$GITHUB_SHA" \
            --latest=false

          gh release upload updater feeds/out/* --clobber
