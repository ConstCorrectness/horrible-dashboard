name: Release

# Build the desktop app on all three OSes, sign the update artifacts, and publish
# them to a GitHub Release together with the signed manifest the app's updater
# reads. The docs workflow is the precedent for publishing from CI.
#
# One-time setup before the first run (see docs/architecture/releases.mdx):
#   1. `pnpm --filter @horrible/desktop exec tauri signer generate -w $HOME/.tauri/horrible.key`
#      (the CLI is a devDependency of @horrible/desktop, not of the root package)
#   2. Put the PUBLIC half in apps/desktop/src-tauri/tauri.conf.json → plugins.updater.pubkey
#      (replacing REPLACE_WITH_TAURI_SIGNING_PUBLIC_KEY — until then the shell does
#      not even register the updater plugin).
#   3. Put the PRIVATE half in the repo secret TAURI_SIGNING_PRIVATE_KEY, and its
#      password in TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# The private key never enters the repository. Losing it means no existing install
# can ever be updated again — a new key is a new identity, and every client refuses
# a manifest it cannot verify. Back it up somewhere that is not this machine.
#
# Channel: the tag decides. `v1.2.3` publishes `latest.json` (stable);
# `v1.2.3-beta.1` publishes `beta.json`. Both live on the same release, because
# `updater.rs` picks a channel by filename, not by host.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Pre-create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          IS_PRERELEASE=""
          if [[ "$TAG" == *"-beta"* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "horrible-dashboard $TAG" \
            --notes "Release $TAG" \
            $IS_PRERELEASE

  build:
    needs: create-release
    strategy:
      # Never cancel the other two: a macOS build failing must not throw away a
      # finished Windows one, since a partial release is still a release people
      # can update to on the platforms it did produce.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux build needs the system webkit/gtk headers; the other two
      # platforms use OS-provided webviews and need nothing.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend the app ships. Built before `tauri-action` because it lands in
      # `src-tauri/backend-runtime`, which `bundle.resources` picks up — run it after,
      # and the installer is built around an empty directory and every packaged app
      # reports "no backend found". The step is ~1 GB of interpreter and wheels, which
      # is what makes the app work offline on a machine with no Python.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build the bundled backend runtime
        run: node scripts/build-backend-runtime.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'horrible-dashboard ${{ github.event.inputs.tag || github.ref_name }}'
          # Not a draft: a draft release's assets need an authenticated request to
          # download, so a manifest pointing at them would verify-then-404 on every
          # client. The safety this gives up is recovered by `publish-manifest`,
          # which is what actually makes a build reachable by the updater and runs
          # only after all four platforms have uploaded.
          releaseDraft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-beta') }}
          # Ship the NSIS installer in the manifest rather than the MSI: the MSI
          # cannot update an app while it is running, which is the only situation
          # an updater ever runs in.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # The hassault native client. A separate job from `build` on purpose: that one is
  # `tauri-action` end to end, while this crate needs its own toolchain targets and a
  # completely different set of Linux system libraries — winit/wgpu/cpal want X11,
  # Wayland and ALSA headers, not webkit and gtk.
  #
  # These assets are **not** in the signed updater manifest. They are fetched by the
  # backend (`backend/modules/hassault/client_install.py`), verified against the
  # sha256 GitHub publishes for the asset, and installed under `$HORRIBLE_DATA_DIR` —
  # which an update is never allowed to touch.
  build-native:
    needs: create-release
    strategy:
      # Same reasoning as `build`: a macOS failure must not throw away a finished
      # Windows client. A player on the platform that did build gets their client.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            binary: hassault-native.exe
            asset: hassault-native-win-x64.exe
          - platform: ubuntu-22.04
            target: ''
            binary: hassault-native
            asset: hassault-native-linux-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            binary: hassault-native
            asset: hassault-native-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            binary: hassault-native
            asset: hassault-native-macos-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native-fps

      # winit needs X11 + Wayland, cpal needs ALSA. Nothing here overlaps with the
      # webkit/gtk set the Tauri job installs, which is why the two jobs cannot share
      # a step: a missing header here fails the link with an error naming a C library,
      # not a Rust crate.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxcursor-dev \
            libxi-dev libxrandr-dev libwayland-dev libasound2-dev

      - name: Build the client
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ matrix.target }}" ]; then ARGS="--target ${{ matrix.target }}"; fi
          cargo build --release --manifest-path apps/native-fps/Cargo.toml $ARGS

      # The asset name is a contract with `client_install.asset_name`, which computes
      # it rather than matching loosely — these are names we control, so a rename here
      # should be a clear miss on the client rather than a wrong download.
      # `backend/tests/test_hassault_client_install.py` reads this file and pins it.
      - name: Upload the client to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            BUILT="apps/native-fps/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            BUILT="apps/native-fps/target/release/${{ matrix.binary }}"
          fi
          cp "$BUILT" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  # `tauri-action` writes `latest.json` onto the release it just built, whose tag
  # moves with every version. The app reads from a *fixed* tag instead (see
  # MANIFEST_BASE in updater.rs), so the finished manifest is copied there under
  # the channel's filename once every platform has uploaded its share — a manifest
  # published before the last platform finishes would offer an update that 404s
  # on the platform still building.
  # `needs` both builds: a manifest is what makes a release reachable, and a
  # release reachable before its client assets exist is one where every install
  # button answers "publishes no client for your platform".
  publish-manifest:
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy the manifest to the fixed updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-beta*) CHANNEL_FILE=beta.json ;;
            *)       CHANNEL_FILE=latest.json ;;
          esac

          gh release download "$TAG" --pattern latest.json --dir . --clobber

          if [ "$CHANNEL_FILE" != "latest.json" ]; then
            mv latest.json "$CHANNEL_FILE"
          fi

          # Idempotent: the fixed release exists after the first run.
          gh release view updater >/dev/null 2>&1 || gh release create updater \
            --title "Update manifests" \
            --notes "Signed update manifests read by the desktop app. Not a build — see .github/workflows/release.yml." \
            --target "$GITHUB_SHA" \
            --latest=false

          gh release upload updater "$CHANNEL_FILE" --clobber
