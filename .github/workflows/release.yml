name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Pre-create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          IS_PRERELEASE=""
          if [[ "$TAG" == *"-beta"* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "horrible-dashboard $TAG" \
            --notes "Release $TAG" \
            $IS_PRERELEASE

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'horrible-dashboard ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-beta') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy the manifest to the fixed updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-beta*) CHANNEL_FILE=beta.json ;;
            *)       CHANNEL_FILE=latest.json ;;
          esac
          gh release download "$TAG" --pattern latest.json --dir . --clobber
          mv latest.json "$CHANNEL_FILE"
          gh release view updater >/dev/null 2>&1 || gh release create updater \
            --title "Update manifests" \
            --notes "Signed update manifests read by the desktop app. Not a build — see .github/workflows/release.yml." \
            --latest=false
          gh release upload updater "$CHANNEL_FILE" --clobber

