name: WebML

# @horrible/webml's tests: the unit project in node, and the kernels project — every
# WGSL kernel run in headless Chromium on SwiftShader (WebGPU on the CPU), so no GPU
# runner is needed. See docs/architecture/webml-gguf-engine.mdx.

on:
  push:
    paths:
      - 'packages/webml/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/webml.yml'
  pull_request:
    paths:
      - 'packages/webml/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/webml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @horrible/webml...

      - name: Typecheck
        run: pnpm --filter @horrible/webml typecheck

      # llama.cpp's vocab-only GGUFs for the tokenizer tests: fetched from a pinned
      # release tag and SHA-256 checked (src/gguf/__tests__/vocab.ts).
      - name: Cache tokenizer vocabularies
        uses: actions/cache@v4
        with:
          path: .cache/webml-vocab
          key: webml-vocab-b6800

      - name: Unit tests
        run: pnpm --filter @horrible/webml test

      # The Chromium build matching the pinned `playwright` devDependency.
      - name: Install Chromium
        run: pnpm --filter @horrible/webml exec playwright install --with-deps chromium

      - name: Kernel tests (Chromium, WebGPU on SwiftShader)
        run: pnpm --filter @horrible/webml test:kernels
