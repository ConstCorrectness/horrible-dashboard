[project]
name = "horrible-train"
version = "0.1.0"
description = "In-notebook helper for horrible-dashboard training: stream metrics, frames, and model graphs to the UI over a stdout sentinel protocol."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horrible_train"]
